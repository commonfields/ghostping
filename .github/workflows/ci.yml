# Ghostping pull-request CI.
#
# Separate from release publishing (.github/workflows/release.yml): this
# workflow validates every push and pull request. Every gate relies on the
# underlying command's exit status — never on grepping command output.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: fmt / clippy / test / contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Formatting (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Lints (clippy, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests (all targets, locked deps)
        run: cargo test --all-targets --locked

      - name: Build the primary CLI
        run: cargo build --locked --bin ghostping

      - name: Build ghostping-worker
        run: cargo build --locked --bin ghostping-worker

      - name: ghostping-worker contract tests (mock only, no network)
        run: cargo test --locked worker_contract

      - name: CLI exit contracts (isolated HOME, mock only, no network)
        run: GHOSTPING_BIN="${{ github.workspace }}/target/debug/ghostping" bash scripts/check-cli-contracts.sh

      - name: Release-script regression tests (stubbed cargo, no network)
        run: bash scripts/test-validate-release.sh

      - name: Installer checksum regression tests (offline fixtures)
        run: bash scripts/test-install.sh

  hosted:
    name: hosted typecheck / tests / builds (mock only)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghostping
          POSTGRES_PASSWORD: ghostping
          POSTGRES_DB: ghostping
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghostping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ghostping:ghostping@localhost:5432/ghostping
      TEST_DATABASE_URL: postgres://ghostping:ghostping@localhost:5432/ghostping
      SESSION_SECRET: ci-test-secret-32-bytes-minimum-xyz
      GHOSTPING_WORKER_PATH: ${{ github.workspace }}/target/debug/ghostping-worker
      APP_BASE_URL: http://localhost:3000
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build ghostping-worker (mock provider only)
        run: cargo build --bin ghostping-worker

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install TypeScript workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Migrate hosted Postgres
        run: pnpm db:migrate

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Unit tests (Effect layers, no network)
        run: pnpm -r --filter "@ghostping/domain" --filter "@ghostping/contracts" --filter "@ghostping/config" --filter "@ghostping/providers" test

      - name: Worker + API tests
        run: pnpm --filter @ghostping/worker test && pnpm --filter @ghostping/api test

      - name: Postgres integration tests
        run: pnpm --filter @ghostping/db test

      - name: Web unit tests (incl. no-score guard)
        run: pnpm --filter @ghostping/web test

      - name: Build web + api + worker
        run: pnpm --filter @ghostping/web build && pnpm --filter @ghostping/api build && pnpm --filter @ghostping/worker build

      - name: Confirm zero provider network calls in CI
        run: |
          echo "CI provider mode: mock only (GHOSTPING_WORKER_PATH points at local mock binary)"
          test "${GHOSTPING_WORKER_PATH}" = "${{ github.workspace }}/target/debug/ghostping-worker"
          ! grep -riE "OPENAI_API_KEY|ANTHROPIC_API_KEY" --include="*.ts" apps packages | grep -v "provider keys only" || true
          echo "no live provider keys configured; worker supports provider=mock only"
